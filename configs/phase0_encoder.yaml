phase: 0
mode: probe
backbone:
  kind: encoder
  model_id: google-bert/bert-base-multilingual-cased
  dtype: float32
router:
  hidden_size: 768
  mlp_hidden: 512
  mlp_out: 256
training:
  lr: 3.0e-4
  epochs: 5
  batch_size: 64
  weight_decay: 0.01
  fp16: false
  seed: 42
eval:
  ece_bins: 15
  bootstrap_samples: 1000
  gates:
    macro_f1: 0.70
    hard_negative_accuracy: 0.75
    ece_max: 0.15
